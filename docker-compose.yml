version: "3.9"

services:
  api:
    build: .
    container_name: tracking-post-ir
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

